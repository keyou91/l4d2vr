name: Native VR candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "L4D2VR/**"
      - "dxvk_new/**"
      - "thirdparty/**"
      - "l4d2vr.sln"
      - "tools/build_candidate.py"
      - "docs/playtest-candidate.md"
      - ".github/workflows/build-d3d9.yml"
  push:
    paths:
      - "L4D2VR/**"
      - "dxvk_new/**"
      - "thirdparty/**"
      - "l4d2vr.sln"
      - "tools/build_candidate.py"
      - "docs/playtest-candidate.md"
      - ".github/workflows/build-d3d9.yml"

permissions:
  contents: read

concurrency:
  group: native-vr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x86 native candidate
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build from a temporary source snapshot
        id: candidate
        shell: pwsh
        run: |
          python -B -X utf8 tools/build_candidate.py --skip-tests
          if ($LASTEXITCODE -ne 0) { throw 'Native candidate build failed' }
      - name: Upload native candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l4d2vr-candidate-x86
          path: ${{ steps.candidate.outputs.candidate }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload native build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-build-logs
          path: ${{ runner.temp }}/l4d2vr-candidate-*/logs/*.log
          if-no-files-found: warn
          retention-days: 7
